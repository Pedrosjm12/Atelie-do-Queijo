pre-commit:
  parallel: true
  jobs:
    - name: lint-e-formatacao
      group:
        piped: true
        jobs:
          - name: eslint
            glob: '*.{js,jsx,mjs,ts,tsx}'
            run: npx eslint --fix {staged_files}
            stage_fixed: true
          - name: prettier
            glob: '*.{js,jsx,mjs,ts,tsx,json,css,yml,yaml}'
            run: npx prettier --write {staged_files}
            stage_fixed: true
    - name: typecheck
      glob: '*.{ts,tsx,mts}'
      run: npm run typecheck
